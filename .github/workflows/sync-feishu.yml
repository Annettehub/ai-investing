name: Sync Feishu Drive Files

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-feishu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_SYNC_MANIFEST: .feishu-sync-manifest.json
        run: python scripts/sync_feishu_drive.py

      - name: Review synced files for knowledge ingest
        run: >
          python scripts/review_feishu_ingest.py
          --from-manifest .feishu-sync-manifest.json
          --write-source-cards
          --write-log

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add 03-raw/feishu 03-raw/.synced_hashes.json 02-kb/sources 02-kb/log.md 05-meta/ingest-reviews
          if git diff --cached --quiet; then
            echo "No Feishu changes to commit."
          else
            git commit -m "Sync feishu drive and review ingest: $(date +%Y-%m-%d-%H:%M)"
            git push
          fi
